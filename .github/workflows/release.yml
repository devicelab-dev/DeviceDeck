# Cut a release when a v* tag is pushed: build the Swift sidecars and the Go
# binary on macOS, sign + notarize them (Developer ID), package side by side
# with `make release-signed`, and upload the archive install.sh downloads.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Signing is skipped gracefully if the signing secrets are absent, so forks and
# pre-setup tags still produce a working (unsigned) archive. See
# docs/launch/CODESIGNING.md for the secrets to add.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14      # Apple Silicon
            arch: arm64
          - runner: macos-13      # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID != ''
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Prepare notarization API key
        if: env.DEVELOPER_ID != ''
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/api.p8"

      - name: Build, sign, notarize, package
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: make release-signed VERSION=${{ steps.v.outputs.version }}

      - name: Upload archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/devicedeck-${{ steps.v.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true
