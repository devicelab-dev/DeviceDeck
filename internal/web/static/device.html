<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title is the one place a hint reaches an agent without putting
       our words inside the app's own content: a snapshot prints the page
       title above the tree, and nothing else we could attach survives —
       data-testid, aria-description and title on an element were each
       measured to be invisible there. The device's hardware keys have no
       buttons on this page, deliberately, so an agent has no way to
       discover them; this is where they are advertised. -->
  <title>DeviceDeck Device — hardware keys have no buttons here; call window.devicedeck.gesture('home'|'appSwitcher'|'notificationCenter'|'lockScreen')</title>
  <!-- Explicit icon: without it browsers request /favicon.ico, and the
       404 surfaces as a console error in every automation client. -->
  <link rel="icon" href="/favicon.svg">
  <style>
    /* The automation page: video + a real DOM mirror of the native tree.
       Deliberately minimal — this DOM is a test target, so it contains
       nothing but the device. */
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #000; }
    #stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
    #video { max-width: 100%; max-height: 100%; background: #000; }
    /* The mirror is a scroll container that never visibly scrolls.

       XCUITest reports rows below the fold with their real frames, so
       the mirror holds elements past its own bottom edge. Unclipped,
       those were hit-testable below the device: a click on one went
       through, the tap coordinate clamped to the device's edge, and the
       wrong element was tapped — silently. overflow:hidden clips them,
       and it keeps the element programmatically scrollable, which is the
       point: scrollIntoView before a click (Playwright and Cypress both do
       it) and a direct scrollTop write (cy.scrollTo) land here as scroll
       events, and device.js turns each one into a finger drag and resets
       the offset. The native list moves; the mirror never does. */
    #mirror { position: absolute; overflow: hidden; }
    /* While an action's barrier is open — from the action until the
       settled tree has been rendered — the mirror is never still.
       Playwright refuses to click an element whose box moves between two
       frames and retries until it holds, so a click aimed mid-animation
       waits for the screen to come to rest instead of landing on the
       bounds of a screen that has already moved on. The movement is two
       points on a transparent layer: nothing to see, and every frame's
       box differs from the last. Instability is the one actionability
       check that costs nothing else — taking pointer events away was
       tried first, and an agent's snapshot lost every ref with them,
       because refs are minted only for nodes that receive them. */
    @keyframes dd-unsettled {
      from { transform: translateY(0); }
      to { transform: translateY(2px); }
    }
    #mirror[data-dd-settled="false"] { animation: dd-unsettled 160ms linear infinite alternate; }
    #mirror [data-dd-node] {
      position: absolute;
      /* Real, visible-to-Playwright elements that add no pixels: no
         background, no border; text present for getByText but painted
         transparent so the video underneath stays clean. */
      color: transparent;
      overflow: hidden;
      user-select: none;
      cursor: default;
      font: 10px/1 sans-serif;
      /* A native container's frame spans its children, so mirroring the
         tree faithfully stacks big transparent divs over the leaves they
         contain — and a later sibling wins the hit test. Playwright then
         refuses to click a perfectly visible control because "another
         element intercepts pointer events". Containers must therefore be
         click-through and only leaves clickable. Clicking a container
         still works: the hit lands on a descendant, which the actionability
         check accepts. `hittable` cannot serve here — iOS reports it false
         for whole visible subtrees (see device.js). */
      pointer-events: none;
    }
    #mirror [data-dd-node]:not(:has([data-dd-node])) { pointer-events: auto; }
    /* Containers must not clip. Rows below the fold sit inside the list
       inside the window, and a window that clips to the screen takes
       them out of the mirror's scrollable overflow, so nothing is left
       for scrollIntoView to scroll. The mirror is the one that clips.
       Leaves keep overflow:hidden: a 13-point icon labelled "Favourite"
       would otherwise spill its text, and the spill is hit-testable. */
    #mirror [data-dd-node]:has([data-dd-node]) { overflow: visible; }
    /* A control that happens to contain something else is still a control.
       Culling every parent made the cart button unclickable the moment it
       grew a badge — an agent could only reach it through the child image,
       and the button itself vanished from what a snapshot offers as
       actionable. Only the roles that represent something a person taps
       are listed: a role-bearing *container* like a list or a navigation
       bar spans its children and would go back to swallowing their
       clicks. A control's own children stay clickable and, being on top,
       still win a hit test aimed at them. */
    #mirror [data-dd-node][role="button"],
    #mirror [data-dd-node][role="link"],
    #mirror [data-dd-node][role="textbox"],
    #mirror [data-dd-node][role="searchbox"],
    #mirror [data-dd-node][role="checkbox"],
    #mirror [data-dd-node][role="radio"],
    #mirror [data-dd-node][role="switch"],
    #mirror [data-dd-node][role="tab"] { pointer-events: auto; }
    /* A div paints nothing by default; an <input> paints a border, an
       opaque background and a caret. Mirrored fields are inputs so that
       fill() works, which made two white boxes float over the video and
       blank out whatever sat behind them. Everything the user agent adds
       has to come back off — the device draws the real field, and its
       own caret, in the video underneath. */
    #mirror input[data-dd-node] {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      caret-color: transparent;
      font: inherit;
    }
    #mirror input[data-dd-node]:focus { outline: none; }
    /* ::placeholder carries its own colour and ignores the transparent
       one above, so the placeholder painted a second copy of the field's
       own prompt on top of the app's. It still has to exist as an
       attribute — it is what names the field for getByRole. */
    #mirror input[data-dd-node]::placeholder { color: transparent; }
    /* A refused page looks identical to a working one: the video still
       streams, the mirror still updates, and only the touches go nowhere.
       Someone driving by hand reads that as "DeviceDeck is broken".

       The text is drawn from an attribute via ::after rather than written
       into the DOM. aria-hidden alone was measured to be insufficient: it
       hides the notice from getByRole and from an ARIA snapshot, but
       getByText still matched it, which would let our sentence satisfy an
       assertion meant for the app. Generated content has no text node, so
       there is nothing for a text query to find. */
    #notice {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 10px 14px;
      background: #b3261e; color: #fff;
      font: 13px/1.4 -apple-system, system-ui, sans-serif;
      pointer-events: none;
      display: none;
    }
    #notice[data-shown] { display: block; }
    #notice::after { content: attr(data-reason); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="video"></canvas>
    <div id="mirror" role="application" aria-label="device"></div>
    <div id="notice" aria-hidden="true"></div>
  </div>
  <!-- The first tree rides in the page, so the mirror is complete when
       load fires — an agent's navigate waits for nothing else. Filled by
       the server; empty when the tree could not be fetched in time. -->
  <script id="dd-first-tree" type="application/json"></script>
  <script src="/video-common.js"></script>
  <script src="/input-common.js"></script>
  <script src="/device.js"></script>
</body>
</html>
