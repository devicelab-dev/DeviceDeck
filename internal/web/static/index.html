<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeviceDeck</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">DeviceDeck</span>
    <a class="maker" href="https://devicelab.dev" target="_blank" rel="noopener"><img src="devicelab-logo.png" alt="" width="16" height="16">by DeviceLab</a>
    <span class="console-only" hidden id="console-controls">
      <button id="btn-back" title="Back to device library">&#8249; Devices</button>
    </span>
    <span class="spacer"></span>
    <span id="status"></span>
    <a class="star" href="https://github.com/devicelab-dev/DeviceDeck" target="_blank" rel="noopener" title="Star DeviceDeck on GitHub">&#9733; Star</a>
  </header>
  <section id="library">
    <div class="library-head">
      <h1>Devices</h1>
      <span id="library-summary"></span>
    </div>
    <div id="library-groups" class="cards"></div>
    <div class="library-head apps-head">
      <h2>Apps</h2>
      <span id="apps-summary"></span>
    </div>
    <div id="library-apps"></div>
  </section>
  <main id="console-view" hidden>
    <aside id="sidebar">
      <section>
        <h3>Device</h3>
        <div id="device-label"></div>
        <div id="device-meta"></div>
        <div class="copy-row"><input id="device-id" readonly spellcheck="false"><button class="copy" data-copy="device-id" title="Copy the device id">Copy</button></div>
        <button id="btn-end" class="end-session" title="Stop DeviceDeck on this device and shut it down">End session</button>
      </section>
      <section>
        <h3>App</h3>
        <span id="apps-picker" hidden>
          <select id="app-pick" title="App builds passed to devicedeck with --app"></select>
          <button id="btn-launch" title="Install it if this device lacks it, then launch it at its first screen">&#9654; Launch</button>
        </span>
        <input id="app" placeholder="app bundle id (for Record and Inspect)" spellcheck="false">
      </section>
      <section>
        <h3>Use it</h3>
        <label for="device-url">From tests</label>
        <div class="copy-row"><input id="device-url" readonly spellcheck="false"><button class="copy" data-copy="device-url" title="Copy the device page URL">Copy</button></div>
        <label for="claude-ask">From Claude Code</label>
        <div class="copy-row"><input id="claude-ask" readonly spellcheck="false"><button class="copy" data-copy="claude-ask" title="Copy a prompt for Claude">Copy</button></div>
      </section>
    </aside>
    <div id="stage">
      <canvas id="video" tabindex="0"></canvas>
      <div id="overlay" hidden></div>
      <div id="stage-loading" hidden>
        <div id="device-frame" class="device-frame">
          <div class="frame-screen"></div>
          <div class="frame-brand">
            <img src="devicelab-logo-128.png" alt="DeviceLab" width="72" height="72">
            <div id="loading-text">Connecting…</div>
          </div>
        </div>
      </div>
      <div id="check-menu" role="menu" hidden>
        <button role="menuitem" data-check="visible">Assert visible</button>
        <button role="menuitem" data-check="wait">Wait until visible</button>
      </div>
      <div id="stage-fault" role="alert" hidden>
        <div class="fault-card">
          <strong id="fault-title"></strong>
          <p id="fault-detail"></p>
          <button id="fault-action" hidden></button>
        </div>
      </div>
    </div>
    <aside id="panel">
      <section id="tools">
        <h3>Controls</h3>
        <div class="tools">
          <button id="btn-home" class="tool" title="Swipe to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
          <button id="btn-switcher" class="tool" title="App switcher"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12" height="14" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v12"/></svg><span>Switcher</span></button>
          <button id="btn-lock" class="tool" title="Lock button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Lock</span></button>
          <button id="btn-shot" class="tool" title="Save screenshot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="4"/></svg><span>Shot</span></button>
          <button id="btn-inspect" class="tool" title="Toggle tree inspector"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><span>Inspect</span></button>
          <button id="btn-record" class="tool record" title="Record session as a Maestro flow"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" class="fill"/></svg><span>Record</span></button>
        </div>
      </section>
      <section id="inspector">
        <h2 id="node-title">—</h2>
        <div id="flow-actions" hidden>
          <button id="flow-copy" title="Copy the flow YAML">Copy</button>
          <a id="flow-download" class="button" download="flow.yaml" title="Choose where to save the flow and what to call it">Download</a>
        </div>
        <pre id="node-info"></pre>
      </section>
    </aside>
  </main>
  <script src="video-common.js"></script>
  <script src="input-common.js"></script>
  <script src="flow-yaml.js"></script>
  <script src="app.js"></script>
</body>
</html>
