<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeviceDeck</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">DeviceDeck</span>
    <a class="maker" href="https://devicelab.dev" target="_blank" rel="noopener">by DeviceLab</a>
    <span class="console-only" hidden id="console-controls">
      <button id="btn-back" title="Back to device library">&#8249; Devices</button>
      <span id="device-label"></span>
      <input id="app" placeholder="app bundle id (for tree)" spellcheck="false">
    </span>
    <span class="spacer"></span>
    <span class="console-only" hidden id="console-actions">
      <button id="btn-record" title="Record session as a Maestro flow">&#9679; Record</button>
      <button id="btn-assert" title="Record an assertion: the next tap asserts the element is visible instead of tapping it" hidden>&#10003; Assert</button>
      <button id="btn-home" title="Swipe to home">Home</button>
      <button id="btn-switcher" title="App switcher">Switcher</button>
      <button id="btn-lock" title="Lock button">Lock</button>
      <button id="btn-shot" title="Save screenshot">Shot</button>
      <button id="btn-inspect" title="Toggle tree inspector">Inspect</button>
    </span>
    <span id="status"></span>
    <a class="star" href="https://github.com/devicelab-dev/DeviceDeck" target="_blank" rel="noopener" title="Star DeviceDeck on GitHub">&#9733; Star</a>
  </header>
  <section id="library">
    <div class="library-head">
      <h1>Devices</h1>
      <span id="library-summary"></span>
    </div>
    <div id="library-groups"></div>
  </section>
  <main id="console-view" hidden>
    <div id="stage">
      <canvas id="video" tabindex="0"></canvas>
      <div id="overlay" hidden></div>
      <div id="stage-loading" hidden>
        <div id="device-frame" class="device-frame">
          <div class="frame-screen"></div>
          <div id="loading-text">Connecting…</div>
        </div>
      </div>
    </div>
    <aside id="panel" hidden>
      <h2 id="node-title">—</h2>
      <pre id="node-info"></pre>
    </aside>
  </main>
  <script src="video-common.js"></script>
  <script src="input-common.js"></script>
  <script src="app.js"></script>
</body>
</html>
